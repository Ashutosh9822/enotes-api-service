spring:
  application:
    name: enotes-api-service

  profiles:
    active: dev

---

# =========================
# DEV CONFIGURATION
# =========================

spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:mysql://localhost:3306/enotes_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: samsung@121

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  mail:
    host: smtp.gmail.com
    username: ashutoshbeura636@gmail.com
    password: zacxzlzsacxlpveb
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

springdoc:
  swagger-ui:
    operationsSorter: method
    tagsSorter: alpha
    path: /enotes-doc
  api-docs:
    path: /enotes-api-doc
management:
  endpoints:
    web:
      exposure:
        include: '*'
#  exclude: beans,logger - used to exclude or discard some selected actuators
#  endpoint:
#    shutdown:
#      enabled: true  - used to shutdown with actuatoor with POST method

file:
  upload:
    path: notes/

